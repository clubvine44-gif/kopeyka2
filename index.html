<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Копейка</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* styles loaded via app - critical overrides */
.cash-card{padding:16px}
.cash-card .label{margin-bottom:12px}
.cash-col .mid{font-size:22px;font-weight:800;letter-spacing:-.02em}
.cash-free{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:12px}
.cash-free b{font-size:16px}
.cash-rows .row{padding:4px 0}
.cash-note{margin-top:6px}
#tapCash{cursor:default}
.fab::before,.fab::after{content:none!important;display:none!important}
.nav-arc:not(.show),.nav-arc:not(.show) *{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
</style>
<link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
<header class="topbar">
  <button class="brand" id="brandHome" type="button"><span class="dot"></span> Копейка</button>
  <div class="topbar-notice" id="topNotice" hidden><span class="tn-dot"></span><span class="tn-text"></span></div>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="btnTheme" title="Тема">◐</button>
  </div>
</header>
<main id="main"></main>
<button type="button" class="fab" id="fab" aria-label="Меню">+</button>
<div class="nav-backdrop" id="navBackdrop"></div>
<div class="nav-arc" id="navArc"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=12"></script>
<script src="cloud.js?v=4"></script>
</body>
</html>
