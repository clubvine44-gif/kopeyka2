<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14151B"><title>Копейка</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
[hidden]{display:none!important}
/* Копейка 2 — clean UI */
:root{
  --bg:#14151B; --surface:#1A1C24; --surface2:#22252F; --border:#2C3040;
  --text:#F2F1EC; --dim:#9A9AA8; --safe:#45D6A0; --danger:#F0665F; --warn:#E8B84A;
  --brand:#E5A75E; --brand2:#B5652F; --brand-glow:rgba(229,167,94,.38);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius:16px; --fab:58px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);min-height:100%}
body{padding-bottom:calc(88px + var(--safe-bottom))}
.topbar{
  position:sticky; top:0; z-index:40;
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:6px;
  padding:12px 16px; background:rgba(20,21,27,.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.brand{
  display:flex; align-items:center; gap:8px; justify-self:start;
  background:none; border:0; color:var(--text); font-weight:700; font-size:16px; cursor:pointer;
}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand-glow)}
.top-actions{display:flex; align-items:center; gap:4px; justify-self:end}
.topbar-notice{
  justify-self:center; display:flex; align-items:center; gap:6px;
  max-width:100%; padding:6px 12px; border-radius:999px;
  background:linear-gradient(135deg, rgba(229,167,94,.20), rgba(69,214,160,.12));
  border:1px solid rgba(229,167,94,.32);
  font-size:12px; font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transform:translateY(-4px) scale(.96);
  transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;
}
.topbar-notice.show{opacity:1; transform:translateY(0) scale(1)}
.topbar-notice .tn-dot{width:6px; height:6px; border-radius:50%; background:var(--safe); flex:none; box-shadow:0 0 6px var(--safe)}
.topbar-notice .tn-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2); color:var(--text); cursor:pointer;
}
main{padding:14px 16px 24px; max-width:560px; margin:0 auto}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; margin-bottom:12px;
}
.card.hero{background:radial-gradient(130% 160% at 100% 0%,rgba(229,167,94,.10),transparent 55%),linear-gradient(160deg,#1A1C24,#161820)}
.card.hero .big{margin:4px 0 2px}
.label{font-size:12px;color:var(--dim);margin-bottom:4px}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.mid{font-size:22px;font-weight:700}
.faint{font-size:12px;color:var(--dim);margin-top:4px}
.pos{color:var(--safe)} .neg{color:var(--danger)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid2 .card{margin-bottom:0}
.cash-card{background:radial-gradient(140% 160% at 0% 0%,rgba(229,167,94,.07),transparent 55%),linear-gradient(160deg,#1A1C24,#171922);padding:16px}
.cash-card .label{margin-bottom:12px}
.cash-top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:10px}
.cash-col{min-width:0}
.cash-col.right{text-align:right}
.cash-col .mid{font-size:22px;font-weight:800;letter-spacing:-.02em}
.cash-free{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:12px}
.cash-free b{font-size:16px}
.cash-divider{height:1px; background:var(--border); margin:0 0 10px}
.cash-rows .row{padding:4px 0}
.cash-note{margin-top:6px}
.cash-card .mid{font-size:20px}
.section{font-size:13px;font-weight:700;color:var(--dim);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.btn{
  border:0; border-radius:12px; padding:12px 16px; font-weight:600; font-size:14px; cursor:pointer;
}
.btn-primary{background:linear-gradient(145deg,var(--brand),var(--brand2)); color:#291605; width:100%; box-shadow:0 6px 18px var(--brand-glow)}
.btn-secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border); width:100%}
.btn-ghost{background:transparent;color:var(--dim);border:0;padding:8px 0; width:100%}
.btn-danger{background:rgba(240,102,95,.15);color:var(--danger);border:1px solid rgba(240,102,95,.3);width:100%}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.field input,.field select,textarea{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font-size:15px;
}
.field.modern label{
  font-size:11px; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; color:var(--dim); margin-bottom:8px;
}
.field.modern input,
.field.modern select,
.field.modern textarea{
  border-radius:14px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  padding:14px 16px;
  font-size:16px;
  transition:border-color .2s, background .2s, box-shadow .2s;
}
.field.modern input:focus,
.field.modern select:focus,
.field.modern textarea:focus{
  outline:none;
  border-color:rgba(229,167,94,.5);
  background:rgba(229,167,94,.07);
  box-shadow:0 0 0 3px rgba(229,167,94,.14);
}
.field.modern input[type="checkbox"]{width:auto; padding:0; margin-right:8px}
.field.modern select{
  appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%239A9AA8' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat; background-position:right 14px center; padding-right:38px;
}
.field.modern input[type="number"]{appearance:textfield; -moz-appearance:textfield}
.field.modern input[type="number"]::-webkit-outer-spin-button,
.field.modern input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.field.modern input[type="date"]{color-scheme:dark}
.field.modern input::placeholder{color:var(--dim); opacity:.7}
.field.modern input:hover,
.field.modern select:hover,
.field.modern textarea:hover{border-color:rgba(255,255,255,.16)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{font-size:11px;color:var(--dim);text-align:center;padding:4px}
.cal-day{
  aspect-ratio:1; border-radius:12px; border:1px solid transparent;
  background:var(--surface2); color:var(--text); font-size:13px; cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.cal-day.off{opacity:.55}
.cal-day.today{border-color:var(--brand); box-shadow:inset 0 0 0 1px rgba(229,167,94,.25)}
.cal-day .dot{width:6px;height:6px;border-radius:50%}
.cal-day .dot.day{background:#5B8CFF}
.cal-day .dot.night{background:#A78BFA}
.cal-day .dot.off{background:#555}
.item{
  display:flex; align-items:center; gap:12px; padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.05); cursor:pointer;
}
.item:last-child{border-bottom:0}
.item .ico{font-size:20px;width:28px;text-align:center}
.item .meta{flex:1;min-width:0}
.item .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--dim)}
.item .amt{font-weight:700;white-space:nowrap}
.fab{
  position:fixed; left:50%; bottom:calc(18px + var(--safe-bottom));
  transform:translateX(-50%);
  width:var(--fab); height:var(--fab); border-radius:50%; border:0;
  background:linear-gradient(150deg,#F0C384,var(--brand) 42%,var(--brand2));
  color:#291605;
  font-size:28px; font-weight:300; line-height:1; cursor:pointer; z-index:100;
  box-shadow:0 10px 28px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.22);
  transition:transform .22s cubic-bezier(.22,.9,.28,1), background .22s, filter .15s;
}
.fab:active{filter:brightness(1.08)}
.fab.open{transform:translateX(-50%) rotate(45deg); background:linear-gradient(150deg,#524C5C,#332F3B); color:#F2F1EC; box-shadow:0 10px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1)}
.nav-backdrop{
  position:fixed; inset:0; z-index:80; background:rgba(6,8,14,.62);
  backdrop-filter:blur(10px); opacity:0; pointer-events:none; transition:opacity .28s;
}
.nav-backdrop.show{opacity:1; pointer-events:auto}
.nav-arc{
  position:fixed; left:50%; bottom:calc(18px + var(--safe-bottom) + 20px);
  width:0; height:0; z-index:90; pointer-events:none;
  contain:layout style;
}
.nav-arc.show{pointer-events:auto}
.nav-arc:not(.show){visibility:hidden;opacity:0}
.nav-arc:not(.show) .nav-btn{opacity:0!important;pointer-events:none}
.nav-btn{
  position:absolute; left:0; top:0;
  width:60px; height:60px; margin:-30px 0 0 -30px;
  border-radius:50%; border:1px solid rgba(229,167,94,.16);
  background:
    radial-gradient(120% 130% at 30% 22%, rgba(255,255,255,.09), rgba(255,255,255,0) 45%),
    linear-gradient(160deg,#2A2634,#1B1720);
  color:var(--text); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  opacity:0; transform:translate3d(0,0,0) scale(.35);
  transition:transform .32s cubic-bezier(.22,1,.32,1), opacity .26s ease;
  box-shadow:
    0 10px 26px rgba(0,0,0,.42),
    inset 0 1px 0 rgba(255,255,255,.09),
    inset 0 -6px 10px rgba(0,0,0,.32),
    inset 0 0 0 3px rgba(0,0,0,.22),
    0 0 0 1px rgba(229,167,94,.06);
  padding:0;
}
.nav-arc.show .nav-btn{opacity:1; will-change:transform,opacity}
.nav-btn .nav-ico{font-size:21px; line-height:1; filter:saturate(1.1)}
.nav-btn .lbl{
  font-size:9px; font-weight:700; color:var(--dim);
  text-transform:uppercase; letter-spacing:.04em;
  max-width:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.nav-btn.active{
  border-color:rgba(229,167,94,.6);
  box-shadow:0 0 0 2px rgba(229,167,94,.22),0 10px 26px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.09),inset 0 -6px 10px rgba(0,0,0,.32);
}
.nav-btn.add{
  background:linear-gradient(150deg,#F0C384,var(--brand) 42%,var(--brand2));
  color:#291605; border:0;
  box-shadow:0 10px 26px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.2);
}
.nav-btn.add .lbl{color:rgba(41,22,5,.7)}
.nav-btn:active{filter:brightness(1.1)}
.modal-wrap{
  position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.5);
  display:flex; align-items:flex-end; justify-content:center;
}
@media(min-width:640px){.modal-wrap{align-items:center}}
.modal{
  background:var(--surface); width:100%; max-width:480px; max-height:88vh; overflow:auto;
  border-radius:22px 22px 0 0; padding:20px 20px calc(24px + var(--safe-bottom));
}
@media(min-width:640px){.modal{border-radius:22px}}
.modal h2{margin:0 0 16px; font-size:18px}
.modal-actions{display:flex; gap:10px; margin-top:16px}
.modal-actions .btn{flex:1}
.toast{
  position:fixed; left:50%; bottom:calc(90px + var(--safe-bottom)); transform:translateX(-50%);
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  padding:10px 10px 10px 16px; border-radius:12px; z-index:200; font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  display:flex; align-items:center; gap:10px; max-width:calc(100vw - 32px);
}
.toast-undo{
  border:0; background:rgba(229,167,94,.15); color:var(--brand);
  font-weight:700; font-size:13px; padding:6px 12px; border-radius:8px; cursor:pointer;
  white-space:nowrap; flex-shrink:0;
}
.period-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.period-nav button{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2); color:var(--text); cursor:pointer; font-size:18px;
}
.empty{text-align:center; padding:32px 16px; color:var(--dim)}
.empty .emoji{font-size:36px; margin-bottom:8px}
.cloud-account{position:relative; margin-left:8px}
.cloud-btn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; position:relative; padding:0;
}
.cloud-dot{
  position:absolute; right:2px; bottom:2px;
  width:10px; height:10px; border-radius:50%;
  background:#555; border:2px solid var(--surface);
}
.cloud-dot.on{background:var(--brand)}
.cloud-menu{
  position:absolute; right:0; top:48px; width:260px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:12px; z-index:200;
  box-shadow:0 16px 40px rgba(0,0,0,.45);
}
.cloud-email{font-weight:600; margin-bottom:4px; word-break:break-all}
.cloud-status{font-size:12px; color:var(--dim); margin-bottom:10px}
.cloud-status.ok{color:var(--safe)}
.cloud-menu .btn{margin-bottom:6px}
.cloud-auth{
  position:fixed; inset:0; z-index:300;
  background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center;
  padding:16px;
}
.cloud-auth-card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:24px; width:100%; max-width:380px;
}
.cloud-auth-msg{font-size:13px; color:var(--warn); min-height:20px; margin-bottom:8px}
.analytics-card{padding:16px}
.an-title{font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.an-donut-wrap{display:flex;align-items:center;gap:16px}
.an-donut{width:110px;height:110px;border-radius:50%;flex:none;position:relative}
.an-donut-hole{position:absolute;inset:22px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.an-donut-hole .an-sum{font-size:13px;font-weight:800}
.an-donut-hole .an-sub{font-size:10px;color:var(--dim)}
.an-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.an-leg-row{display:flex;align-items:center;gap:8px}
.an-swatch{width:10px;height:10px;border-radius:3px;flex:none}
.an-leg-name{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-leg-val{font-size:12px;font-weight:700;white-space:nowrap}
.an-bars{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.an-bar-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:4px}
.an-bar-track{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.an-bar-fill{height:100%;border-radius:99px;min-width:2px}
.an-empty{font-size:13px;color:var(--dim);text-align:center;padding:12px 0}
.reserve-cat-grid{display:grid;gap:8px;margin-bottom:12px}
.reserve-cat-btn{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-size:14px}
.reserve-cat-btn.active{border-color:rgba(229,167,94,.45);background:rgba(229,167,94,.1);box-shadow:0 0 0 2px rgba(229,167,94,.12)}
.reserve-cat-btn .rc-sub{display:block;font-size:11px;color:var(--dim);margin-top:2px}
@media(min-width:900px){
  .fab{left:auto; right:28px; transform:none}
  .fab.open{transform:rotate(45deg)}
  .nav-arc{left:auto; right:56px}
}

.fab::before,.fab::after{content:none!important;display:none!important}
.nav-arc:not(.show),.nav-arc:not(.show) *{opacity:0!important;visibility:hidden!important;pointer-events:none!important}

  width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; position:relative; padding:0;
}
.cloud-dot{
  position:absolute; right:2px; bottom:2px;
  width:10px; height:10px; border-radius:50%;
  background:#555; border:2px solid var(--surface);
}
.cloud-dot.on{background:var(--brand)}
.cloud-menu{
  position:absolute; right:0; top:48px; width:260px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:12px; z-index:200;
  box-shadow:0 16px 40px rgba(0,0,0,.45);
}
.cloud-email{font-weight:600; margin-bottom:4px; word-break:break-all}
.cloud-status{font-size:12px; color:var(--dim); margin-bottom:10px}
.cloud-status.ok{color:var(--safe)}
.cloud-menu .btn{margin-bottom:6px}
.cloud-auth{
  position:fixed; inset:0; z-index:300;
  background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center;
  padding:16px;
}
.cloud-auth-card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:24px; width:100%; max-width:380px;
}
.cloud-auth-msg{font-size:13px; color:var(--warn); min-height:20px; margin-bottom:8px}
.analytics-card{padding:16px}
.an-title{font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.an-donut-wrap{display:flex;align-items:center;gap:16px}
.an-donut{width:110px;height:110px;border-radius:50%;flex:none;position:relative}
.an-donut-hole{position:absolute;inset:22px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.an-donut-hole .an-sum{font-size:13px;font-weight:800}
.an-donut-hole .an-sub{font-size:10px;color:var(--dim)}
.an-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.an-leg-row{display:flex;align-items:center;gap:8px}
.an-swatch{width:10px;height:10px;border-radius:3px;flex:none}
.an-leg-name{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-leg-val{font-size:12px;font-weight:700;white-space:nowrap}
.an-bars{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.an-bar-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:4px}
.an-bar-track{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.an-bar-fill{height:100%;border-radius:99px;min-width:2px}
.an-empty{font-size:13px;color:var(--dim);text-align:center;padding:12px 0}
.reserve-cat-grid{display:grid;gap:8px;margin-bottom:12px}
.reserve-cat-btn{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-size:14px}
.reserve-cat-btn.active{border-color:rgba(229,167,94,.45);background:rgba(229,167,94,.1);box-shadow:0 0 0 2px rgba(229,167,94,.12)}
.reserve-cat-btn .rc-sub{display:block;font-size:11px;color:var(--dim);margin-top:2px}
@media(min-width:900px){
  .fab{left:auto; right:28px; transform:none}
  .fab.open{transform:rotate(45deg)}
  .nav-arc{left:auto; right:56px}
}

.fab::before,.fab::after{content:none!important;display:none!important}
.nav-arc:not(.show),.nav-arc:not(.show) *{opacity:0!important;visibility:hidden!important;pointer-events:none!important}

];
function defaultState(){return{version:2,settings:{currentBalance:0,dailyLimitMode:'strict',cyclePattern:['day','day','night','night','off','off'],anchorDate:'2026-08-17',anchorIndex:1,shiftTypes:{day:{label:'\u0414\u043d\u0435\u0432\u043d\u0430\u044f',rate:480000,start:'07:00',end:'19:00'},night:{label:'\u041d\u043e\u0447\u043d\u0430\u044f',rate:480000,start:'19:00',end:'07:00'}},theme:'dark'},income:[],expenses:[],reserves:[],debts:[],recurring:[],reserveOps:[],shiftsOverride:{},notes:[]};}

const historyStack=[];

let UNDO_STACK=[];

function normalizeIncoming(s){const d=defaultState();const out=Object.assign({},d,s||{});out.settings=Object.assign({},d.settings,(s&&s.settings)||{});out.settings.shiftTypes=Object.assign({},d.settings.shiftTypes,(s.settings&&s.settings.shiftTypes)||{});if(!out.settings.anchorDate&&out.settings.cycleAnchor)out.settings.anchorDate=out.settings.cycleAnchor;if(out.settings.anchorIndex==null)out.settings.anchorIndex=1;if(!out.settings.cyclePattern||!out.settings.cyclePattern.length)out.settings.cyclePattern=['day','day','night','night','off','off'];['income','expenses','reserves','debts','recurring','reserveOps','notes'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[]});if(!out.shiftsOverride||typeof out.shiftsOverride!=='object')out.shiftsOverride={};return out}
function cycleIndexForDate(dateStr,settings){const pattern=settings.cyclePattern||['day','day','night','night','off','off'];const anchor=settings.anchorDate||'2026-08-17';const anchorIndex=N(settings.anchorIndex);const a=new Date(anchor+'T12:00:00');const b=new Date(dateStr+'T12:00:00');const diff=Math.round((b-a)/86400000);return((anchorIndex+diff)%pattern.length+pattern.length)%pattern.length}

function shiftIncome(sh){if(sh.type==='off'||sh.status==='cancelled'||sh.status==='absence'||sh.status==='off')return 0;return N(sh.amount)}
function currentPeriod(){const y=VIEW.y,m=VIEW.m;const start=y+'-'+String(m).padStart(2,'0')+'-01';const end=y+'-'+String(m).padStart(2,'0')+'-'+String(daysInMonth(y,m)).padStart(2,'0');return{start,end}}
function computeSummary(start,end){const today=todayStr();let actualShift=0,expectedShift=0;for(let d=start;d<=end;d=addDays(d,1)){const sh=getShift(d);const amt=shiftIncome(sh);if(sh.status==='worked')actualShift+=amt;else if(sh.status==='planned')expectedShift+=amt}let actualManual=0,expectedManual=0;STATE.income.filter(i=>i.date>=start&&i.date<=end).forEach(i=>{if(i.status==='actual')actualManual+=N(i.amount);else expectedManual+=N(i.amount)});const actualIncome=actualShift+actualManual,expectedIncome=expectedShift+expectedManual,totalIncome=actualIncome+expectedIncome;let actualReg=0,plannedReg=0,actualObl=0,plannedObl=0;STATE.expenses.filter(e=>e.date>=start&&e.date<=end).forEach(e=>{const past=e.date<=today;if(e.mandatory){if(past)actualObl+=N(e.amount);else plannedObl+=N(e.amount)}else{if(past)actualReg+=N(e.amount);else plannedReg+=N(e.amount)}});
/* \u0434\u043e\u043b\u0433\u0438: \u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0435\u0449\u0451 \u0434\u043e\u043b\u0436\u043d\u044b (debtsDue) \u0438 \u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0443\u0436\u0435 \u0432\u044b\u043f\u043b\u0430\u0447\u0435\u043d\u043e (debtsPaid, \u0443\u043c\u0435\u043d\u044c\u0448\u0430\u0435\u0442 \u0431\u0430\u0437\u043e\u0432\u044b\u0439 \u043e\u0441\u0442\u0430\u0442\u043e\u043a) */

/* \u043f\u043e\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f/\u0441\u043d\u044f\u0442\u0438\u044f \u043f\u043e \u0440\u0435\u0437\u0435\u0440\u0432\u0430\u043c \u0432 \u044d\u0442\u043e\u043c \u043f\u0435\u0440\u0438\u043e\u0434\u0435 (\u0435\u0441\u043b\u0438 \u0435\u0441\u0442\u044c \u043e\u043f\u0435\u0440\u0430\u0446\u0438\u0438) */
const ops=Array.isArray(STATE.reserveOps)?STATE.reserveOps:[];const inPeriod=o=>o&&o.date>=start&&o.date<=end&&o.date<=today;const reserveDeposits=ops.filter(o=>o.type==='deposit'&&inPeriod(o)).reduce((a,o)=>a+N(o.amount),0);const reserveWithdrawals=ops.filter(o=>o.type==='withdraw'&&inPeriod(o)).reduce((a,o)=>a+N(o.amount),0);
let reservesNeeded=0;STATE.reserves.filter(r=>r.active!==false).forEach(r=>{let need=0;if(r.method==='fixed')need=N(r.fixedAmount);else if(r.method==='percent')need=totalIncome*N(r.percent)/100;else if(r.method==='target'&&r.targetDate){const left=Math.max(0,N(r.target)-N(r.saved));const td=String(r.targetDate);if((td>=start&&td<=end)||td<start)need=left}const dep=ops.filter(o=>o&&o.reserveId===r.id&&o.type==='deposit'&&inPeriod(o)).reduce((a,o)=>a+N(o.amount),0);reservesNeeded+=Math.max(0,Math.round(need)-dep)});

function openNav(){navOpen=true;const bd=document.getElementById('navBackdrop'),arc=document.getElementById('navArc'),fab=document.getElementById('fab');bd.classList.add('show');arc.classList.add('show');fab.classList.add('open');const items=NAV.concat([{id:'__add__',label:'\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c',icon:'+'}]);const n=items.length;const baseRadius=window.matchMedia('(max-width:899px)').matches?128:150;const start=Math.PI,end=0;arc.innerHTML=items.map((it,i)=>{const t=n===1?0.5:i/(n-1);const ang=start+(end-start)*t;const radius=baseRadius+(i%2?30:0);const x=Math.cos(ang)*radius,y=-Math.sin(ang)*radius;const active=ROUTE===it.id?' active':'';const add=it.id==='__add__'?' add':'';return '<button type="button" class="nav-btn'+active+add+'" data-id="'+it.id+'" style="transform:translate3d(0,0,0) scale(.35);will-change:transform,opacity" data-x="'+x+'" data-y="'+y+'"><span class="nav-ico">'+it.icon+'</span><span class="lbl">'+it.label+'</span></button>'}).join('');requestAnimationFrame(()=>{requestAnimationFrame(()=>{arc.querySelectorAll('.nav-btn').forEach((btn,i)=>{btn.style.transitionDelay=(i*28)+'ms';btn.style.transform='translate3d('+btn.dataset.x+'px,'+btn.dataset.y+'px,0) scale(1)'})})});arc.querySelectorAll('.nav-btn').forEach(btn=>{btn.onclick=()=>{const id=btn.dataset.id;closeNav();if(id==='__add__'){openQuickAdd();return}go(id)}})}

function showModal(html){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-wrap"><div class="modal">'+html+'</div></div>';root.querySelector('.modal-wrap').addEventListener('click',e=>{if(e.target.classList.contains('modal-wrap'))closeModal()})}

function openIncomeForm(id){const rec=id?STATE.income.find(x=>x.id===id):null;let opts='<option value="">— не откладывать</option>';STATE.reserves.filter(r=>r.active!==false).forEach(r=>{const sel=rec&&rec.reserveId===r.id?' selected':'';opts+='<option value="'+r.id+'"'+sel+'>'+esc(r.title)+' · '+fmt(N(r.saved))+'</option>'});showModal('<h2>'+(rec?'Доход':'Новый доход')+'</h2><div class="field modern"><label>Название</label><input id="fTitle" value="'+esc(rec?rec.title:'')+'"></div><div class="field modern"><label>Сумма, ₽</label><input id="fAmt" type="number" inputmode="decimal" value="'+(rec?Math.round(N(rec.amount)/100):'')+'"></div><div class="field modern"><label>Дата</label><input id="fDate" type="date" value="'+(rec?rec.date:todayStr())+'"></div><div class="field modern"><label>Статус</label><select id="fStatus"><option value="actual">Получено</option><option value="expected">Ожидается</option></select></div><div class="field modern"><label>Отложить в резерв</label><select id="fReserve">'+opts+'</select><div class="faint" style="margin-top:6px">Сумма увеличит накопление выбранной цели</div></div><div class="field modern"><label>Комментарий</label><div style="display:flex;gap:8px"><input id="fComment" style="flex:1" value="'+esc(rec?rec.comment:'')+'"><button type="button" class="btn btn-secondary" style="width:auto;padding:0 12px" id="fMic">🎤</button></div></div><div class="modal-actions"><button class="btn btn-secondary" id="fCancel">Отмена</button><button class="btn btn-primary" id="fSave">Сохранить</button></div>'+(rec?'<button class="btn btn-danger" style="margin-top:10px" id="fDel">Удалить</button>':''));if(rec)document.getElementById('fStatus').value=rec.status||'actual';wireMic('fComment','fMic');document.getElementById('fCancel').onclick=closeModal;document.getElementById('fSave').onclick=()=>{pushUndo(rec?'Доход изменён':'Доход добавлен');const title=document.getElementById('fTitle').value.trim()||'Доход';const amount=Math.round(N(document.getElement function openReserveForm(id){const rec=id?STATE.reserves.find(x=>x.id===id):null;const cats=[{id:'cushion',title:'Подушка безопасности',sub:'на чёрный день'},{id:'license',title:'Права на машину',sub:'на обучение / права'},{id:'custom',title:'Другая цель',sub:'своё название'}];const curCat=rec?(rec.category||'custom'):'cushion';let html='<h2>'+(rec?'Резерв':'Новый резерв')+'</h2><div class="field modern"><label>Категория</label><div class="reserve-cat-grid" id="rcats">';cats.forEach(c=>{html+='<button type="button" class="reserve-cat-btn'+(curCat===c.id?' active':'')+'" data-cat="'+c.id+'">'+c.title+'<span class="rc-sub">'+c.sub+'</span></button>'});html+='</div></div>';html+='<div class="field modern" id="fTitleWrap"'+(curCat==='custom'?'':' style="display:none"')+'><label>Название цели</label><input id="fTitle" value="'+esc(rec&&rec.category==='custom'?rec.title:'')+'"></div>';html+='<div class="field modern"><label>Цель, ₽</label><input id="fTarget" type="number" inputmode="decimal" value="'+(rec&&rec.target?Math.round(N(rec.target)/100):'')+'"></div>';html+='<div class="field modern"><label>Метод откладывания</label><select id="fMethod"><option value="fixed">Фикс. сумма в месяц</option><option value="percent">% от дохода</option><option value="target">К дате</option></select></div>';html+='<div class="field modern"><label>Фикс / % / дата</label><input id="fExtra" value="'+esc(rec?(rec.method==='target'?(rec.targetDate||''):(rec.method==='percent'?rec.percent:Math.round(N(rec.fixedAmount)/100))):'')+'"></div>';if(rec)html+='<div class="faint" style="margin-bottom:10px">Накоплено: '+fmt(N(rec.saved))+' — пополняется через доходы → «Отложить в резерв»</div>';html+='<div class="modal-actions"><button class="btn btn-secondary" id="fCancel">Отмена</button><button class="btn btn-primary" id="fSave">Сохранить</button></div>';if(rec)html+='<button class="btn btn-danger" style="margin-top:10px" id="fDel">Удалить</button>';showModal(html);if(rec)document.getElementById('fMethod').value=rec.method||'fixed';let selectedCat=curCat;document.querySelectorAll('#rcats .reserve-cat-btn').forEach(btn=>{btn.onclick=()=>{selectedCat=btn.dataset.cat;document.querySelectorAll('#rcats .reserve-cat-btn').forEach(b=>b.classList.toggle('active',b===btn));document.getElementById('fTitleWrap').style.display=selectedCat==='custom'?'':'none'}});document.getElementById('fCancel').onclick=closeModal;document.getElementById('fSave').onclick=()=>{pushUndo(rec?'Резерв изменён':'Резерв добавлен');const map={cushion:'Подушка безопасности',license:'Права на машину'};let title=map[selectedCat]||'Другая цель';if(selectedCat==='custom')title=document.getElementById('fTitle').value.trim()||'Другая цель';const target=Math.round(N(document.getElementById('fTarget').value)*100);const method=document.getElementById('fMethod').value;const extra=document.getElementById('fExtra').value.trim();const obj={id:rec?rec.id:uid(),title,category:selectedCat,target,method,active:true,saved:rec?N(rec.saved):0};if(method==='percent')obj.percent=N(extra);else if(method==='target')obj.targetDate=extra;else obj.fixedAmount=Math.round(N(extra)*100);if(rec)Object.assign(rec,obj);else STATE.reserves.push(obj);saveState();closeModal();render();toastUndo('Сохранено')};if(rec)document.getElementById('fDel').onclick=()=>{pushUndo('Резерв удалён');STATE.reserves=STATE.reserves.filter(x=>x.id!==id);saveState();closeModal();render();toastUndo('Удалено')}}

function wireMic(inputId,btnId){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const btn=document.getElementById(btnId);if(!btn)return;btn.onclick=()=>{if(!SR){toast('\u0413\u043e\u043b\u043e\u0441 \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d');return}const r=new SR();r.lang='ru-RU';btn.style.opacity='.5';r.onresult=ev=>{const inp=document.getElementById(inputId);inp.value+=(inp.value?' ':'')+ev.results[0][0].transcript};r.onend=()=>{btn.style.opacity='1'};try{r.start()}catch(e){btn.style.opacity='1'}}}
function renderHome(){const{start,end}=currentPeriod();const s=computeSummary(start,end);const limit=s.daily;const limitClass=limit==null?'':(limit<0?'neg':'pos');const res=STATE.reserves.filter(r=>r.active!==false).reduce((a,r)=>a+N(r.saved),0);const debt=STATE.debts.reduce((a,d)=>a+Math.max(0,N(d.amount)-N(d.paid)),0);const buckets=[];const expMap={};STATE.expenses.filter(e=>e.date>=start&&e.date<=end).forEach(e=>{const k=(e.title||'Расход').trim()||'Расход';expMap[k]=(expMap[k]||0)+N(e.amount)});Object.keys(expMap).forEach(k=>buckets.push({name:k,val:expMap[k]}));STATE.reserves.filter(r=>r.active!==false&&N(r.saved)>0).forEach(r=>buckets.push({name:r.title||'Резерв',val:N(r.saved)}));if(debt>0)buckets.push({name:'Долги',val:debt});buckets.sort((a,b)=>b.val-a.val);const top=buckets.slice(0,6);const totalAn=top.reduce((a,b)=>a+b.val,0)||1;const colors=['#E5A75E','#5B8CFF','#4FD1A5','#A78BFA','#F0665F','#E8B84A'];let html='<div class="card hero"><div class="period-nav"><strong>'+MONTHS[VIEW.m-1]+' '+VIEW.y+'</strong><div><button type="button" id="pm">‹</button> <button type="button" id="nm">›</button></div></div><div class="label">Можно потратить сегодня</div><div class="big '+limitClass+'">'+(limit==null?'—':fmt(limit))+'</div><div class="faint">строгий режим · дней: '+s.remainingDays+'</div></div>';html+='<div class="grid2"><div class="card"><div class="label">Доступно</div><div class="mid '+(s.strictAvailable<0?'neg':'pos')+'">'+fmt(s.strictAvailable)+'</div></div><div class="card"><div class="label">Вручную</div><div class="mid">'+fmt(s.actualManual||0)+'</div><div class="faint">что внёс сам</div></div></div>';html+='<div class="card cash-card"><div class="label">Касса и резервы</div><div class="cash-top"><div class="cash-col"><div class="faint">Баланс</div><div class="mid">'+fmt(s.cash)+'</div></div><div class="cash-col right"><div class="faint">Зарезервировано</div><div class="mid pos">'+fmt(res)+'</div></div></div><div class="cash-free"><span class="faint">Свободно</span><b class="'+(s.cash-res<0?'neg':'pos')+'">'+fmt(s.cash-res)+'</b></div><div class="cash-divider"></div><div class="cash-rows"><div class="row"><span>План расходов</span><b class="neg">−'+fmt(s.plannedRegular+s.plannedObligatory)+'</b></div><div class="row"><span>Резервы к отложить</span><b class="neg">−'+fmt(s.reservesNeeded)+'</b></div><div class="row"><span>Долги к оплате</span><b class="neg">−'+fmt(s.debtsDue)+'</b></div></div>'+(debt>0?'<div class="faint cash-note">в долгах ещё '+fmt(debt)+'</div>':'')+'</div>';html+='<div class="card analytics-card"><div class="an-title">Куда уходят деньги</div>';if(!top.length)html+='<div class="an-empty">Добавь расходы или пополни резервы — здесь появится картина</div>';else{let grad=[],acc=0;top.forEach((b,i)=>{const pct=b.val/totalAn*100;const from=acc;acc+=pct;grad.push(colors[i%colors.length]+' '+from.toFixed(1)+'% '+acc.toFixed(1)+'%')});html+='<div class="an-donut-wrap"><div class="an-donut" style="background:conic-gradient('+grad.join(',')+')"><div class="an-donut-hole"><div class="an-sum">'+fmt(totalAn)+'</div><div class="an-sub">в фокусе</div></div></div><div class="an-legend">';top.forEach((b,i)=>{html+='<div class="an-leg-row"><span class="an-swatch" style="background:'+colors[i%colors.length]+'"></span><span class="an-leg-name">'+esc(b.name)+'</span><span class="an-leg-val">'+fmt(b.val)+'</span></div>'});html+='</div></div><div class="an-bars">';top.forEach((b,i)=>{const pct=Math.max(2,Math.round(b.val/totalAn*100));html+='<div class="an-bar-row"><div class="an-bar-meta"><span>'+esc(b.name)+'</span><span>'+pct+'%</span></div><div class="an-bar-track"><div class="an-bar-fill" style="width:'+pct+'%;background:'+colors[i%colors.length]+'"></div></div></div>'});html+='</div>'}html+='</div>';html+='<div class="card"><div class="label">Со смен</div><div class="row"><span>Отработано</span><b>'+fmt(s.actualShift||0)+'</b></div><div class="row"><span>Ещё по графику</span><b class="pos">'+fmt(s.expectedShift||0)+'</b></div></div>';document.getElementById('main').innerHTML=html;document.getElementById('pm').onclick=()=>{VIEW.m--;if(VIEW.m<1){VIEW.m=12;VIEW.y--}render()};document.getElementById('nm').onclick=()=>{VIEW.m++;if(VIEW.m>12){VIEW.m=1;VIEW.y++}render()};

function renderCalendar(){const y=VIEW.y,m=VIEW.m;const first=new Date(y,m-1,1);let startPad=(first.getDay()+6)%7;const dim=daysInMonth(y,m);const today=todayStr();let dayShifts=0,nightShifts=0,offs=0,actualInc=0,expectedInc=0;const{start,end}=currentPeriod();for(let d=start;d<=end;d=addDays(d,1)){const sh=getShift(d);if(sh.type==='off'){offs++;continue}if(sh.type==='day')dayShifts++;else if(sh.type==='night')nightShifts++;const inc=shiftIncome(sh);if(sh.status==='worked')actualInc+=inc;else if(sh.status==='planned')expectedInc+=inc}const shifts=dayShifts+nightShifts;const income=actualInc+expectedInc;let html='<div class="card"><div class="period-nav"><strong>'+MONTHS[m-1]+' '+y+'</strong><div><button type="button" id="pm">\u2039</button> <button type="button" id="nm">\u203a</button></div></div><div class="cal-grid">';WD.forEach(w=>{html+='<div class="cal-head">'+w+'</div>'});for(let i=0;i<startPad;i++)html+='<div></div>';for(let day=1;day<=dim;day++){const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');const sh=getShift(ds);const cls=(sh.type==='off'?' off':'')+(ds===today?' today':'');html+='<button type="button" class="cal-day'+cls+'" data-d="'+ds+'"><span>'+day+'</span><span class="dot '+sh.type+'"></span></button>'}html+='</div></div><div class="card"><div class="label">\u0420\u0430\u0441\u0447\u0451\u0442 \u043c\u0435\u0441\u044f\u0446\u0430</div><div class="row"><span>\u0414\u043d\u0435\u0432\u043d\u044b\u0445 \u0441\u043c\u0435\u043d</span><b>'+dayShifts+'</b></div><div class="row"><span>\u041d\u043e\u0447\u043d\u044b\u0445 \u0441\u043c\u0435\u043d</span><b>'+nightShifts+'</b></div><div class="row"><span>\u0412\u0441\u0435\u0433\u043e \u0441\u043c\u0435\u043d</span><b>'+shifts+'</b></div><div class="row"><span>\u0412\u044b\u0445\u043e\u0434\u043d\u044b\u0445</span><b>'+offs+'</b></div><div class="row"><span>\u041e\u0442\u0440\u0430\u0431\u043e\u0442\u0430\u043d\u043e</span><b class="pos">'+fmt(actualInc)+'</b></div><div class="row"><span>\u0415\u0449\u0451 \u043e\u0436\u0438\u0434\u0430\u0435\u0442\u0441\u044f</span><b class="pos">'+fmt(expectedInc)+'</b></div><div class="row"><span>\u0417\u0430\u0440\u043f\u043b\u0430\u0442\u0430 \u0437\u0430 \u043c\u0435\u0441\u044f\u0446</span><b class="pos">'+fmt(income)+'</b></div><div class="faint">'+fmt(N(STATE.settings.shiftTypes.day&&STATE.settings.shiftTypes.day.rate))+' \u0434\u043d\u0435\u0432\u043d\u0430\u044f \u00b7 '+fmt(N(STATE.settings.shiftTypes.night&&STATE.settings.shiftTypes.night.rate))+' \u043d\u043e\u0447\u043d\u0430\u044f \u00b7 \u0446\u0438\u043a\u043b '+esc((STATE.settings.cyclePattern||[]).join('/'))+'</div></div>';document.getElementById('main').innerHTML=html;document.getElementById('pm').onclick=()=>{VIEW.m--;if(VIEW.m<1){VIEW.m=12;VIEW.y--}render()};document.getElementById('nm').onclick=()=>{VIEW.m++;if(VIEW.m>12){VIEW.m=1;VIEW.y++}render()};document.querySelectorAll('.cal-day[data-d]').forEach(btn=>{btn.onclick=()=>openShiftEditor(btn.dataset.d)})}
function openShiftEditor(dateStr){const sh=getShift(dateStr);showModal('<h2>'+dateStr+'</h2><div class="field modern"><label>\u0422\u0438\u043f</label><select id="sType"><option value="day">\u0414\u043d\u0435\u0432\u043d\u0430\u044f</option><option value="night">\u041d\u043e\u0447\u043d\u0430\u044f</option><option value="off">\u0412\u044b\u0445\u043e\u0434\u043d\u043e\u0439</option></select></div><div class="field modern"><label>\u0421\u0443\u043c\u043c\u0430, \u20bd</label><input id="sAmt" type="number" value="'+Math.round(N(sh.amount)/100)+'"></div><div class="field modern"><label>\u0421\u0442\u0430\u0442\u0443\u0441</label><select id="sSt"><option value="planned">\u041f\u043b\u0430\u043d</option><option value="worked">\u041e\u0442\u0440\u0430\u0431\u043e\u0442\u0430\u043d\u0430</option><option value="cancelled">\u041e\u0442\u043c\u0435\u043d\u0430</option></select></div><div class="modal-actions"><button class="btn btn-secondary" id="sX">\u041e\u0442\u043c\u0435\u043d\u0430</button><button class="btn btn-primary" id="sS">\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c</button></div>');document.getElementById('sType').value=sh.type;document.getElementById('sSt').value=sh.status==='off'?'planned':sh.status;document.getElementById('sX').onclick=closeModal;document.getElementById('sS').onclick=()=>{pushUndo('\u0421\u043c\u0435\u043d\u0430 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0430');const type=document.getElementById('sType').value;const amount=Math.round(N(document.getElementById('sAmt').value)*100);const status=type==='off'?'off':document.getElementById('sSt').value;const cfg=STATE.settings.shiftTypes[type]||{};STATE.shiftsOverride[dateStr]={type,label:type==='off'?'\u0412\u044b\u0445\u043e\u0434\u043d\u043e\u0439':(cfg.label||type),amount,status,comment:''};saveState();closeModal();render();toastUndo('\u0421\u043c\u0435\u043d\u0430 \u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u0430')}}
function renderList(kind){const{start,end}=currentPeriod();let title,list,openFn,addFn,emoji;if(kind==='income'){title='\u0414\u043e\u0445\u043e\u0434\u044b';list=STATE.income.filter(i=>i.date>=start&&i.date<=end);openFn=openIncomeForm;addFn=()=>openIncomeForm();emoji='\ud83d\udcb0'}else if(kind==='expenses'){title='\u0420\u0430\u0441\u0445\u043e\u0434\u044b';list=STATE.expenses.filter(e=>e.date>=start&&e.date<=end);openFn=openExpenseForm;addFn=()=>openExpenseForm();emoji='\ud83e\uddfe'}else if(kind==='reserves'){title='\u0420\u0435\u0437\u0435\u0440\u0432\u044b';list=STATE.reserves;openFn=openReserveForm;addFn=()=>openReserveForm();emoji='\ud83c\udfe6'}else{title='\u0414\u043e\u043b\u0433\u0438';list=STATE.debts;openFn=openDebtForm;addFn=()=>openDebtForm();emoji='\ud83d\udcc9'}let html='<div class="section">'+title+'</div><div class="card">';if(!list.length)html+='<div class="empty"><div class="emoji">'+emoji+'</div>\u041f\u043e\u043a\u0430 \u043f\u0443\u0441\u0442\u043e</div>';else list.forEach(item=>{const name=item.title||item.name||'\u2014';const amt=kind==='reserves'?N(item.saved):(kind==='debts'?Math.max(0,N(item.amount)-N(item.paid)):N(item.amount));const sub=kind==='reserves'?(item.category==='cushion'?'Подушка':item.category==='license'?'Права':(item.method||'')):(item.date||item.dueDate||item.method||'');html+='<div class="item" data-id="'+item.id+'"><div class="ico">'+emoji+'</div><div class="meta"><div class="title">'+esc(name)+'</div><div class="sub">'+esc(sub)+'</div></div><div class="amt">'+fmt(amt)+'</div></div>'});html+='</div><button class="btn btn-primary" id="addBtn">+ \u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c</button>';document.getElementById('main').innerHTML=html;document.getElementById('addBtn').onclick=addFn;document.querySelectorAll('.item[data-id]').forEach(el=>{el.onclick=()=>openFn(el.dataset.id)})}
function renderSettings(){const st=STATE.settings;let html='<div class="section">\u041a\u0430\u0441\u0441\u0430</div><div class="card"><div class="field modern"><label>\u0422\u0435\u043a\u0443\u0449\u0438\u0439 \u0431\u0430\u043b\u0430\u043d\u0441, \u20bd</label><input id="rCash" type="number" inputmode="decimal" value="'+Math.round(N(st.currentBalance)/100)+'"></div><div class="faint" style="margin-bottom:10px">\u041c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u0437\u0434\u0435\u0441\u044c</div><button class="btn btn-primary" id="sCash">\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u0431\u0430\u043b\u0430\u043d\u0441</button></div><div class="section">\u041d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438 \u0441\u043c\u0435\u043d</div><div class="card"><div class="field modern"><label>\u0414\u043d\u0435\u0432\u043d\u0430\u044f \u0441\u0442\u0430\u0432\u043a\u0430, \u20bd</label><input id="rDay" type="number" value="'+Math.round(N(st.shiftTypes.day.rate)/100)+'"></div><div class="field modern"><label>\u041d\u043e\u0447\u043d\u0430\u044f</label><input id="rNight" type="number" value="'+Math.round(N(st.shiftTypes.night.rate)/100)+'"></div><div class="field modern"><label>\u0426\u0438\u043a\u043b</label><input id="rCycle" value="'+esc((st.cyclePattern||[]).join(' '))+'"></div><div class="field modern"><label>\u042f\u043a\u043e\u0440\u044c</label><input id="rAnchor" type="date" value="'+(st.anchorDate||'2026-08-17')+'"></div><div class="field modern"><label>\u0418\u043d\u0434\u0435\u043a\u0441 \u044f\u043a\u043e\u0440\u044f</label><input id="rIdx" type="number" value="'+N(st.anchorIndex)+'"></div><button class="btn btn-primary" id="sSave">\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c</button></div><div class="section">\u0414\u0430\u043d\u043d\u044b\u0435</div><div class="card"><button class="btn btn-secondary" style="margin-bottom:8px" id="bExp">\u0421\u043a\u0430\u0447\u0430\u0442\u044c \u0431\u044d\u043a\u0430\u043f</button><button class="btn btn-secondary" id="bImp">\u0412\u043e\u0441\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c</button><input type="file" id="bFile" accept="application/json" hidden></div><div class="section">\u041e\u043f\u0430\u0441\u043d\u0430\u044f \u0437\u043e\u043d\u0430</div><div class="card"><button class="btn btn-danger" id="bReset">\u041f\u043e\u043b\u043d\u044b\u0439 \u0441\u0431\u0440\u043e\u0441 (\u043b\u043e\u043a\u0430\u043b\u044c\u043d\u043e + \u043e\u0431\u043b\u0430\u043a\u043e)</button><div class="faint" style="margin-top:6px">\u0421\u0442\u0438\u0440\u0430\u0435\u0442 \u0432\u0441\u0451 \u043d\u0430 \u044d\u0442\u043e\u043c \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0435 \u0438 \u0432 \u043e\u0431\u043b\u0430\u043a\u0435. \u0414\u0430\u043d\u043d\u044b\u0435 \u043d\u0435 \u0432\u043e\u0441\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c.</div></div>';document.getElementById('main').innerHTML=html;
document.getElementById('bReset').onclick=()=>{showModal('<h2>\u041f\u043e\u043b\u043d\u044b\u0439 \u0441\u0431\u0440\u043e\u0441</h2><p class="faint">\u0423\u0434\u0430\u043b\u0438\u0442\u0441\u044f \u0432\u0441\u0451: \u0434\u043e\u0445\u043e\u0434\u044b, \u0440\u0430\u0441\u0445\u043e\u0434\u044b, \u0434\u043e\u043b\u0433\u0438, \u0440\u0435\u0437\u0435\u0440\u0432\u044b, \u0441\u043c\u0435\u043d\u044b \u2014 \u043b\u043e\u043a\u0430\u043b\u044c\u043d\u043e \u0438 \u0432 \u043e\u0431\u043b\u0430\u043a\u0435. \u041e\u0442\u043c\u0435\u043d\u0438\u0442\u044c \u043d\u0435\u043b\u044c\u0437\u044f. \u0422\u043e\u0447\u043d\u043e?</p><div class="modal-actions"><button class="btn btn-secondary" id="rX">\u041e\u0442\u043c\u0435\u043d\u0430</button><button class="btn btn-danger" id="rGo">\u0414\u0430, \u0441\u0442\u0435\u0440\u0435\u0442\u044c \u0432\u0441\u0451</button></div>');document.getElementById('rX').onclick=closeModal;document.getElementById('rGo').onclick=async()=>{try{localStorage.removeItem(KEY)}catch(_){}STATE=defaultState();saveState();if(window.kopeykaCloud&&window.kopeykaCloud.save){try{await window.kopeykaCloud.save()}catch(_){}}closeModal();render();toast('\u0412\u0441\u0451 \u0441\u0442\u0451\u0440\u0442\u043e')}};document.getElementById('sCash').onclick=()=>{st.currentBalance=Math.round(N(document.getElementById('rCash').value)*100);saveState();toast('\u0411\u0430\u043b\u0430\u043d\u0441 \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d');render()};
document.getElementById('sSave').onclick=()=>{st.shiftTypes.day.rate=Math.round(N(document.getElementById('rDay').value)*100);st.shiftTypes.night.rate=Math.round(N(document.getElementById('rNight').value)*100);st.cyclePattern=document.getElementById('rCycle').value.trim().split(/\s+/).filter(Boolean);st.anchorDate=document.getElementById('rAnchor').value||'2026-08-17';st.anchorIndex=N(document.getElementById('rIdx').value);saveState();toast('\u0421\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u043e');render()};document.getElementById('bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'kopeyka2',state:STATE},null,2)],{type:'application/json'}));a.download='kopeyka2-'+todayStr()+'.json';a.click()};document.getElementById('bImp').onclick=()=>document.getElementById('bFile').click();document.getElementById('bFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);STATE=normalizeIncoming(d.state||d);saveState();render();toast('\u0412\u043e\u0441\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043e')}catch(err){toast('\u041e\u0448\u0438\u0431\u043a\u0430 \u0444\u0430\u0439\u043b\u0430')}};r.readAsText(f)}}
function render(){if(ROUTE==='home')renderHome();else if(ROUTE==='calendar')renderCalendar();else if(ROUTE==='income')renderList('income');else if(ROUTE==='expenses')renderList('expenses');else if(ROUTE==='reserves')renderList('reserves');else if(ROUTE==='debts')renderList('debts');else if(ROUTE==='settings')renderSettings();else renderHome()}
window.defaultState=defaultState;window.setAppState=function(s){STATE=normalizeIncoming(s);saveState();render()};window.saveState=saveState;Object.defineProperty(window,'STATE',{get:function(){return STATE},set:function(v){STATE=v},configurable:true});window.render=render;window.toast=toast;window.topNotice=topNotice;window.go=go;
function boot(){loadState();document.getElementById('fab').onclick=e=>{e.preventDefault();if(navOpen)closeNav();else openNav()};document.getElementById('navBackdrop').onclick=closeNav;document.getElementById('brandHome').onclick=()=>go('home');document.getElementById('btnTheme').onclick=()=>toast('\u0422\u0451\u043c\u043d\u0430\u044f \u0442\u0435\u043c\u0430');let sx=0,sy=0,st=0,act=false;document.addEventListener('touchstart',e=>{if(!e.touches[0])return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();act=sx<28},{passive:true});document.addEventListener('touchend',e=>{if(!act||!e.changedTouches[0])return;act=false;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=Math.abs(t.clientY-sy),dt=Date.now()-st;if(dx>72&&dy<50&&dt<500)goBack()},{passive:true});render()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
