<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14151B">
<title>Копейка</title>
</head>
<body style="margin:0;background:#14151B;color:#F2F1EC;font-family:system-ui;padding:24px">Загрузка…
<script>
(async function(){
  try{
    const n=6;
    const parts=await Promise.all(
      Array.from({length:n},(_,i)=>fetch('x'+i+'.b64?v=60',{cache:'no-store'}).then(r=>{
        if(!r.ok) throw new Error('x'+i);
        return r.text();
      }))
    );
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bin]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<p>Не удалось загрузить. Обновите страницу.<br><small>'+e+'</small></p>';
  }
})();
</script>
</body></html>
